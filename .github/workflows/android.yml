name: Build SADRUN TRADERS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          mkdir -p "$RUNNER_TEMP/source"
          unzip -q SADRUN_TRADERS_Android_Project.zip.zip -d "$RUNNER_TEMP/source"
          SETTINGS=$(find "$RUNNER_TEMP/source" -name settings.gradle -type f | head -1)
          test -n "$SETTINGS"
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SADRUN-TRADERS-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
